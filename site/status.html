    /* ── garden-warm skin (M6b): standalone lock screen — cream ground,
       charcoal card as the protected-console surface ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAF7F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .lock-screen { text-align: center; padding: 40px; max-width: 420px; width: 100%; background: #2B2B28; border-radius: 1.4rem; box-shadow: 0 18px 40px -18px rgba(78,60,32,.35); margin: 24px; }
    .lock-icon { font-size: 3rem; margin-bottom: 24px; opacity: .6; }
    .lock-title { color: #FAF7F0; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .lock-sub { color: rgba(250,247,240,.72); font-size: .85rem; margin-bottom: 32px; }
    .lock-input { width: 100%; padding: 14px 18px; font-size: 1rem; background: rgba(250,247,240,.08); border: 1px solid rgba(250,247,240,.18); border-radius: 10px; color: #FAF7F0; outline: none; transition: border-color .2s; font-family: 'Courier New', monospace; }
    .lock-input:focus { border-color: #5DCAA5; }
    .lock-input::placeholder { color: rgba(250,247,240,.35); }
    .lock-btn { width: 100%; margin-top: 16px; padding: 14px; font-size: .9rem; font-weight: 700; background: #2E7D4F; color: #fff; border: none; border-radius: 999px; cursor: pointer; transition: background .2s; font-family: 'Courier New', monospace; letter-spacing: .05em; text-transform: uppercase; }
    .lock-btn:hover { background: #0F4A2C; }
    .lock-btn:disabled { opacity: .5; cursor: wait; }
    .lock-error { color: #f56565; font-size: .8rem; margin-top: 12px; min-height: 20px; font-family: 'Courier New', monospace; }
    .lock-footer { color: rgba(250,247,240,.45); font-size: .65rem; margin-top: 40px; font-family: 'Courier New', monospace; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    .shake { animation: shake .4s; }
    /* a11y pack */
    a:focus-visible, button:focus-visible, summary:focus-visible, [role="button"]:focus-visible,
    input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid #E07A2A; outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }

    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

    async function unlock() {
      const pw = document.getElementById('pw').value;
      const btn = document.getElementById('unlockBtn');
      const err = document.getElementById('err');
      if (!pw) { err.textContent = 'Enter a password'; return; }
      btn.disabled = true; btn.textContent = 'Decrypting...'; err.textContent = '';
      try {
        const salt = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
        const iv   = Uint8Array.from(atob(PAYLOAD.iv),   c => c.charCodeAt(0));
        const ct   = Uint8Array.from(atob(PAYLOAD.ct),   c => c.charCodeAt(0));
        const enc  = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
        const html = new TextDecoder().decode(plain);
        // Replace entire page with the decrypted content
        document.open(); document.write(html); document.close();
      } catch(e) {
        btn.disabled = false; btn.textContent = 'Unlock';
        err.textContent = 'Wrong password';
        document.getElementById('pw').classList.add('shake');
        setTimeout(() => document.getElementById('pw').classList.remove('shake'), 500);
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
