name: Persona journeys

on:
  pull_request:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8080' || 'https://www.aigovops-foundation.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve repository for pull requests
        if: github.event_name == 'pull_request'
        run: python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/persona-http.log 2>&1 &
      - name: Wait for local site
        if: github.event_name == 'pull_request'
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run persona journeys
        run: node scripts/test-persona-journeys.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: persona-journeys
          path: test-results/personas/
          if-no-files-found: warn
