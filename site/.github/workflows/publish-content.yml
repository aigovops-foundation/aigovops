name: publish-content

# Drop a story in content/stories/ and it publishes. This renders Markdown into the blog, the
# blog index and the RSS feed, and commits the result to main — GitHub Pages serves main, so the
# post is live within a minute. A story dated in the future waits until its Tuesday. Same shape as fetch-linkedin-posts.yml (an automated commit of
# generated files). Hand-made posts are never touched.

on:
  push:
    branches: [main]
    paths: ["content/**", "scripts/build_content.py"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"    # Tuesdays 06:00 UTC — a story dated today publishes itself; drafts for next week are written

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet markdown
      - name: Self-test the pipeline (throwaway copy; nothing real is touched)
        run: python3 scripts/test_build_content.py
      - name: Render stories + newsletter and LinkedIn drafts (Spanish pages translate once, then cache)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/build_content.py
      - name: Commit what changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A, not an allow-list: build_content.py's write targets have grown before (founders.html
          # was missing here until #153) and a partial `git add` leaves an unstaged file that blocks
          # `git pull --rebase` below without ever failing the job.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish stories from content/ [automated $(date -u +%Y-%m-%d)]"
            # Two merges a minute apart once made this push non-fast-forward (2026-09-13); rebase and retry.
            pushed=0
            for i in 1 2 3; do
              git add -A
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              echo "push attempt $i failed; retrying"; sleep 15
            done
            # A silent failure here is what let this drift for two weeks — fail the job loudly instead,
            # so a stuck push shows up as red CI rather than as a commit that never arrives.
            if [ "$pushed" != "1" ]; then
              echo "::error::publish-content: commit made locally but never reached origin/main after 3 push attempts"
              exit 1
            fi
          fi
