name: Fetch LinkedIn Posts

on:
  schedule:
    - cron: '0 7 * * *'    # 7am UTC = midnight Pacific
    - cron: '0 19 * * *'   # 7pm UTC = noon Pacific
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to commit data/linkedin-posts.json back

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch posts from RSS feeds
        env:
          BOB_RSS: ${{ secrets.BOB_LINKEDIN_RSS }}
          KEN_RSS: ${{ secrets.KEN_LINKEDIN_RSS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_posts.py

      - name: Commit updated posts (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/linkedin-posts.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LinkedIn posts [automated $(date -u +%Y-%m-%d)]"
            git push
          fi
