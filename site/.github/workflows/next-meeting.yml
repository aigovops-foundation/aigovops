name: Next meeting from Luma

on:
  schedule:
    - cron: '30 8 * * *'   # daily, 08:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commits data/next-meeting.json back

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the next in-person meeting from the public Luma calendar
        run: python3 scripts/fetch_next_meeting.py

      - name: Commit the bounded output (data/next-meeting.json only)
        run: |
          OUTPUTS="data/next-meeting.json"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- $OUTPUTS
          STRAY=$(git status --porcelain | grep -v -F "$OUTPUTS" || true)
          if [ -n "$STRAY" ]; then
            echo "::error::the next-meeting job touched files outside its declared outputs:"; echo "$STRAY"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update next meeting from Luma [automated $(date -u +%Y-%m-%d)]"
            git push
          fi
