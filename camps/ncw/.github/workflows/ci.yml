name: CI — landing site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------
  # 1. HTML lint — catches malformed markup before anything else.
  # ---------------------------------------------------------------
  html-lint:
    name: HTML lint (htmlhint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:html

  # ---------------------------------------------------------------
  # 2. Pledge anonymity guard — the pledge must collect no PII and post nowhere.
  # ---------------------------------------------------------------
  api-tests:
    name: Pledge anonymity guard
    runs-on: ubuntu-latest
    needs: html-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:api

  # ---------------------------------------------------------------
  # 3. End-to-end + accessibility + responsiveness.
  # ---------------------------------------------------------------
  e2e:
    name: E2E (Playwright • a11y • mobile)
    runs-on: ubuntu-latest
    needs: html-lint
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - mobile-safari
          - mobile-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright (${{ matrix.project }})
        run: |
          npx playwright test \
            --config=tests/playwright.config.mjs \
            --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces / screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------
  # 4. Internal link check — every relative href resolves.
  # ---------------------------------------------------------------
  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    needs: html-lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:links
      # linkinator skips heavy media (it FETCHES every link; 306MB of video times
      # out a CI runner at the 10s budget and reports false "broken" links — that
      # is what kept this job red from 2026-08-08). Path correctness for those
      # refs is still enforced, by existence check rather than by download.
      - run: python3 scripts/check_row_links.py
      # The videos moved to Spaces on 2026-08-09, which made them EXTERNAL urls — and linkinator
      # skips external. Without this, a rename or delete on the Spaces side would silently blank a
      # video with nothing failing. Ranged GET, so it also proves seeking works.
      - run: python3 scripts/check_video_links.py

  # ---------------------------------------------------------------
  # 5. Build summary — friendly green check on the PR.
  # ---------------------------------------------------------------
  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    if: always()
    needs: [html-lint, api-tests, e2e, link-check]
    steps:
      - name: Aggregate results
        run: |
          echo "html-lint:   ${{ needs.html-lint.result }}"
          echo "api-tests:   ${{ needs.api-tests.result }}"
          echo "e2e:         ${{ needs.e2e.result }}"
          echo "link-check:  ${{ needs.link-check.result }}"
          if [[ "${{ needs.html-lint.result }}" != "success" || \
                "${{ needs.api-tests.result }}" != "success" || \
                "${{ needs.e2e.result }}" != "success" || \
                "${{ needs.link-check.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All required checks passed."
