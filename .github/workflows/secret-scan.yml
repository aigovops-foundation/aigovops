name: secret-scan

# The trunk adopting the estate's shared secret scanner — ladder row 11a.
#
# WHY THIS LANDS HERE AND NOT IN A CENTRAL JOB. A central scanner reading this repo from
# elsewhere would need a long-lived cross-repo PAT — a standing credential the estate would
# then hold and rotate. This repo scanning ITSELF uses only its own scoped token. Calling a
# reusable workflow across repos is not the same thing as reading another repo's data: the job
# runs HERE, in this repo's context, with this repo's token. That distinction is the whole of
# row 11a.

on:
  push:
  pull_request:

# A called workflow's permissions can only be a SUBSET of its caller's, so the caller must
# declare what the callee asks for. An unstated default is an unknown permission set, and the
# estate's autonomy policy treats unknown as not-green.
permissions: { contents: read }

jobs:
  scan:
    uses: aigovops-foundation/aigovops-library-june-ken-bob/.github/workflows/reusable-secret-scan.yml@main
