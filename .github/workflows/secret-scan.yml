name: secret-scan

# The trunk adopting the estate's shared secret scanner — ladder row 11a.
#
# WHY THIS LANDS HERE AND NOT IN A CENTRAL JOB. This repo now holds four products and 122
# commits of merged history, and until this file existed nothing scanned any of it. A central
# scanner reading this repo from elsewhere would need a long-lived cross-repo PAT — a standing
# credential the estate would then hold and rotate. This repo scanning ITSELF uses only its own
# scoped token, and no new secret exists anywhere. Calling a reusable workflow across repos is
# not the same thing as reading another repo's data: the job runs HERE, in this repo's context,
# with this repo's token. That distinction is the whole of row 11a.

on:
  push:
  pull_request:

# A called workflow's permissions can only be a SUBSET of its caller's, so the caller must
# declare what the callee asks for. An unstated default is an unknown permission set, and the
# estate's autonomy policy treats unknown as not-green.
permissions: { contents: read }

jobs:
  scan:
    uses: aigovops-foundation/aigovops-library-june-ken-bob/.github/workflows/reusable-secret-scan.yml@main
    with:
      # TWO FIXTURES, NAMED ONE FILE AT A TIME — never a directory wildcard.
      #
      # The first run of this lane over 122 commits of merged product history found exactly two
      # hits, and both are the case the scanner's own message anticipates. Checked by reading
      # each line rather than by assuming, because "it is probably a fixture" is how a real leak
      # ships:
      #
      #   products/beacon/lab-service/docs/TUTORIAL.md:113
      #     A COMMENTED-OUT example inside a fenced block, showing a reader what the RS256 env
      #     var looks like. Its value is an ellipsis placeholder. No key material.
      #
      #   products/beacon/tests/chaos/test_io.py:101
      #     A chaos test that writes a truncated PEM header followed by the literal word
      #     "garbage", to prove a reload RAISES on a corrupt key file. Being an invalid key is
      #     the entire point of the test.
      #
      # This comment deliberately does not reproduce the PEM header it is describing. The first
      # draft did, and the scanner flagged THIS FILE — a lane that trips on its own explanation
      # of why it tripped.
      #
      # Listed as two exact paths, not `products/beacon/**`: a broad ignore would silently
      # exclude a real secret added to that tree later, which is the failure this estate keeps
      # finding in its own watchers. If either file stops needing the exemption, delete the path
      # and the lane goes back to checking it.
      ignore_globs: "products/beacon/lab-service/docs/TUTORIAL.md products/beacon/tests/chaos/test_io.py"

