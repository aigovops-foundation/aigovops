name: red-main-watchdog

# The trunk adopting the estate's shared red-main watchdog — ladder row 11a.
#
# A red main is only a control if somebody hears it. This repo had no such alarm at all, which
# is how the Library's own Pages deploy managed to fail for nine days without anyone noticing.
#
# 15:30 UTC daily — thirty minutes after the Library's, so the two do not report at once.

on:
  schedule:
    - cron: "30 15 * * *"   # 15:30 UTC daily (08:30 PT) — a working-hours alarm, not a 3am one
  workflow_dispatch:

# REQUIRED, and the reason is worth knowing: this workflow reads Actions history, so it needs
# `actions: read`. A caller on the stock default token cannot satisfy that and the run dies at
# startup with no job and no log — a watchdog that never runs, reporting nothing.
permissions:
  contents: read
  actions: read

jobs:
  red-main:
    uses: aigovops-foundation/aigovops-library-june-ken-bob/.github/workflows/reusable-red-main-watchdog.yml@faab8ce1dbf3849598a8af5a027204dba6d7a0f1 # v1
    with:
      max_red_hours: 48
