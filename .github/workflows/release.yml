name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: write, packages: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: npm test   # the same gate the whole repo lives by

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aigovops:latest
            ghcr.io/${{ github.repository_owner }}/aigovops:${{ github.ref_name }}

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            AiGovOps ${{ github.ref_name }} — pull the image:
            `docker run -p 8930:8930 ghcr.io/${{ github.repository_owner }}/aigovops:${{ github.ref_name }}`
            Then open http://localhost:8930 (Wizard) or /studio (Console).
