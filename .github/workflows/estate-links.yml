name: estate-links
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/monorepo/link-test.mjs
