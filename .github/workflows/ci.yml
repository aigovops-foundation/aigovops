name: ci
on:
  push:
  pull_request:

# Least privilege, declared. An inherited default is an UNKNOWN permission set, and the estate's
# policies/autonomy.yaml treats unknown as not-green. This lane only reads the repo to test it.
# Added with the row 11a adoptions: it would be odd to wire five least-privileged lanes into a
# repo whose own CI still ran on whatever the default happened to be.
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: |
          if ! command -v git-filter-repo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y git-filter-repo
          fi
      - uses: ruby/setup-ruby@44511735964dcb71245e7e55f72539531f7bc0eb # v1.257.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: practice
      - run: node --test scripts/monorepo/
