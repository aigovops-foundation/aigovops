name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "practice/**"
      - "camps/ncw/**"
      - "monorepo.json"
      - "scripts/monorepo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "practice/**"
      - "camps/ncw/**"
      - "monorepo.json"
      - "scripts/monorepo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: npm test   # hard gate: all gate tests must pass before the docs deploy
      - uses: ruby/setup-ruby@44511735964dcb71245e7e55f72539531f7bc0eb # v1.257.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: practice
      - run: node scripts/monorepo/assemble.mjs
      - name: Check current live estate links
        if: github.event_name == 'pull_request'
        run: node scripts/monorepo/link-test.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with: { path: _site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
