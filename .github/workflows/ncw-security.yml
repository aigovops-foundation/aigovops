name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "camps/ncw/**"
      - ".github/workflows/ncw-security.yml"
  push:
    branches: [main]
    paths:
      - "camps/ncw/**"
      - ".github/workflows/ncw-security.yml"
  schedule:
    # Weekly Monday 09:00 UTC sweep for advisories on the dev deps.
    - cron: "0 9 * * 1"
  workflow_dispatch:

defaults:
  run:
    working-directory: camps/ncw

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # CodeQL on the JavaScript surface (docs/assets/js + docs/api).
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript
          queries: security-and-quality
          source-root: camps/ncw
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: "/language:javascript"

  # Block PRs that introduce vulnerable or restrictively licensed deps.
  # Requires Dependency Graph to be enabled on the repo (Settings →
  # Security & analysis). Marked continue-on-error so the absence of
  # the feature doesn't block merges — npm-audit and CodeQL still gate.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Quick npm audit on prod deps. The site has zero runtime npm deps,
  # so this primarily guards the test harness.
  npm-audit:
    name: npm audit (devDependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: camps/ncw/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false
