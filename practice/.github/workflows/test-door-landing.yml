name: test-door-landing

# index.html: a door must land cleanly on "your first hour", with a way back — on
# either path in (a hash link from the site's café doors, or an in-page click on this
# page's own doors grid). scripts/test_door_landing.py checks both directly.

on:
  pull_request:
    paths:
      - index.html
      - scripts/test_door_landing.py
      - docs/THURSDAY.md
      - scripts/test_thursday_fallback.py
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/test_door_landing.py
      - docs/THURSDAY.md
      - scripts/test_thursday_fallback.py

permissions:
  contents: read

jobs:
  door-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_door_landing.py
      - run: python3 scripts/test_thursday_fallback.py
