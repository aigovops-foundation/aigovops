name: link-check

# Every Markdown link in the repo — relative links between worksheets and external links alike —
# must resolve. Practice #3: the rendered Pages have a footer now; this keeps the links honest.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays, before the Letter

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 --max-retries 3 --retry-wait-time 10 --accept 200,201,204,206,301,302,308,403,429,999 --exclude 'linkedin\.com' --exclude 'claude\.ai' './**/*.md'
          fail: true
