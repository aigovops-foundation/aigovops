# Level 100 — the one rule, as code. Three lines of the Umbrella policy schema (PRD v1 §8).
# Plain-words form (FailFest VH-001): "The company stands behind every statement its AI makes to a
# customer and verifies policy answers against the source of truth."
policy: begin-v1
controls:
  - action: customer.reply
    tier: C2
    decision: constrain      # allowed only with a verified policy source attached
