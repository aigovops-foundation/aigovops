# GitHub Pages — renders every Markdown file in this repo as a page (jekyll-relative-links is on by
# default on Pages, so links between .md files work). No theme beyond Primer; the repo is the source of truth.
title: AiGovOps Practice
description: One practice, four levels, four gates — one hour of value at every level. Fall 2026 Release. Conforms to OVERT.
theme: jekyll-theme-primer
plugins: [jekyll-relative-links, jekyll-optional-front-matter, jekyll-readme-index, jekyll-titles-from-headings]
relative_links: { enabled: true, collections: true }
titles_from_headings: { enabled: true, strip_title: true }
exclude: [scripts/, .sitecheck/, VERSION, .gitignore]
